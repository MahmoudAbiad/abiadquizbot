<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>محرر سؤال الرياضيات</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<!-- 🆕 MathLive: مكوّن <math-field> - محرر رياضيات بصري حقيقي (WYSIWYG)، المستخدم
     بيكتب/يضغط أزرار ولوحة مفاتيح رياضية فبيشوف الرياضيات مرسومة فعلياً (كسر حقيقي،
     أس فوقي...) - ما بيشوف أي كود LaTeX ولا رمز $ إطلاقاً بأي وقت. راجع توثيق
     المشروع (mathlive.io) - طريقة esm.run هي الموصى فيها رسمياً من نفس المكتبة
     لدعم jsdelivr CDN (بدل ملف dist/mathlive.min.js القديم). KaTeX أعلاه يبقى
     مستخدم بس للمعاينة النهائية للسؤال الكامل (نص للقراءة فقط)، مش للتحرير. -->
<script type="module">
  import { MathfieldElement } from "https://esm.run/mathlive";
  MathfieldElement.mathVirtualKeyboardPolicy = "auto";
  window.__mathliveReady = true;
</script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
    margin: 0;
    padding: 16px 14px 90px;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 18px 0 8px; color: var(--tg-theme-text-color, #111111); }
  .hint {
    font-size: 12.5px;
    color: var(--tg-theme-hint-color, #888888);
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .section {
    border: 1px solid rgba(128,128,128,0.22);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 14px;
  }
  label.field-label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 5px;
    color: var(--tg-theme-hint-color, #888888);
  }
  textarea, input[type="text"] {
    width: 100%;
    border: 1px solid rgba(128,128,128,0.35);
    border-radius: 10px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--tg-theme-text-color, #111111);
    background: var(--tg-theme-secondary-bg-color, #f7f7f7);
    resize: vertical;
  }
  textarea { min-height: 54px; }
  .option-block { margin-bottom: 14px; }
  .option-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 5px;
  }
  .correct-badge {
    font-size: 11px;
    background: #e6f7ec;
    color: #1e7d3a;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
  }
  .preview-box {
    margin-top: 6px;
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13.5px;
    min-height: 20px;
    line-height: 1.9;
    word-break: break-word;
  }
  .preview-box:empty::before { content: "المعاينة هون..."; color: var(--tg-theme-hint-color, #999); }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    cursor: pointer;
    user-select: none;
  }
  .toggle-row input { width: 17px; height: 17px; }
  table.grid-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  table.grid-table td, table.grid-table th { padding: 3px; vertical-align: middle; }
  .grid-btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .small-btn {
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--tg-theme-button-color, #2ea6ff);
    color: var(--tg-theme-button-color, #2ea6ff);
    background: transparent;
    cursor: pointer;
  }
  .small-btn:disabled { opacity: 0.4; cursor: default; }
  .matrix-card {
    border: 1px dashed rgba(128,128,128,0.35);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 12px;
  }
  .matrix-top-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .matrix-top-row input[type="text"] { flex: 1; }
  select {
    border: 1px solid rgba(128,128,128,0.35);
    border-radius: 10px;
    padding: 8px;
    font-size: 13px;
    background: var(--tg-theme-secondary-bg-color, #f7f7f7);
    color: var(--tg-theme-text-color, #111111);
  }
  .remove-x {
    background: none;
    border: none;
    color: #e05252;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
  }
  .footer-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--tg-theme-bg-color, #ffffff);
    border-top: 1px solid rgba(128,128,128,0.2);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .save-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: var(--tg-theme-button-color, #2ea6ff);
    color: var(--tg-theme-button-text-color, #ffffff);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .save-btn:disabled { opacity: 0.55; }
  .status-text { font-size: 12.5px; text-align: center; margin-top: 8px; min-height: 16px; }
  .status-text.error { color: #d32f2f; }
  .status-text.ok { color: #1e7d3a; }
  #loadingState, #errorState { text-align: center; padding: 60px 10px; font-size: 14px; color: var(--tg-theme-hint-color, #888); }
  #formState { display: none; }

  /* ==================== 🆕 حقول الرياضيات البصرية (MathLive) ==================== */
  math-field {
    display: block;
    width: 100%;
    border: 1px solid rgba(128,128,128,0.35);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 16px;
    background: var(--tg-theme-secondary-bg-color, #f7f7f7);
    --primary-color: var(--tg-theme-button-color, #2ea6ff);
  }
  math-field.mf-compact { min-width: 64px; font-size: 14px; padding: 6px 8px; }

  /* ==================== 🆕 حقل قابل للتبديل: نص عادي ⟷ معادلة بصرية ==================== */
  .mtf-row { display: flex; align-items: flex-start; gap: 6px; }
  .mtf-row .mtf-slot { flex: 1; min-width: 0; }
  .mtf-toggle {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid rgba(128,128,128,0.3);
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    font-size: 15px;
    cursor: pointer;
  }
  .mtf-wrap.compact .mtf-toggle { width: 30px; height: 30px; font-size: 13px; }
  .mtf-hint { font-size: 10.5px; color: var(--tg-theme-hint-color, #999); margin-top: 3px; }

  /* ==================== 🆕 أجزاء (Segments) نص السؤال ==================== */
  .segment-row { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 8px; }
  .segment-tag {
    flex: 0 0 auto;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    font-size: 13px;
  }
  .segment-row > input[type="text"] { flex: 1; }
  .segment-row > math-field { flex: 1; }
  .add-segment-btns { display: flex; gap: 8px; margin-top: 6px; }
  .segments-counter { font-size: 11px; color: var(--tg-theme-hint-color, #999); text-align: left; margin-top: 4px; }
</style>
</head>
<body>

<div id="loadingState">⏳ جارٍ تحميل السؤال...</div>
<div id="errorState" style="display:none;"></div>

<div id="formState">
  <h1>🌐 محرر سؤال الرياضيات</h1>
  <div class="hint">اكتب النص العادي بشكل طبيعي، ولإضافة رياضيات اضغط "➕ معادلة" وبتقدر تبني الصيغة بصرياً (كسر، جذر، أس...) وشوفها مرسومة فعلياً وإنت عم تكتب.</div>

  <div class="section">
    <h2 style="margin-top:0;">🔎 معاينة السؤال الكامل</h2>
    <div class="preview-box" id="fullPreview"></div>
  </div>

  <div class="section">
    <label class="field-label">نص السؤال</label>
    <div id="segmentsContainer"></div>
    <div class="add-segment-btns">
      <button type="button" class="small-btn" id="addTextSegmentBtn">➕ نص</button>
      <button type="button" class="small-btn" id="addMathSegmentBtn">➕ معادلة</button>
    </div>
    <div class="segments-counter" id="questionCounter"></div>
  </div>

  <div class="section" id="optionsSection">
    <h2 style="margin-top:0;">الإجابات</h2>
    <div id="optionsContainer"></div>
  </div>

  <div class="section">
    <div class="toggle-row" id="tableToggleRow">
      <input type="checkbox" id="tableToggle">
      <span>هذا السؤال يحتوي جدول بيانات</span>
    </div>
    <div id="tableEditor" style="display:none;"></div>
  </div>

  <div class="section">
    <h2 style="margin-top:0;">المصفوفات</h2>
    <div id="matricesContainer"></div>
    <div class="grid-btns">
      <button type="button" class="small-btn" id="addMatrixBtn">➕ أضف مصفوفة</button>
    </div>
  </div>
</div>

<div class="footer-bar" id="footerBar" style="display:none;">
  <button class="save-btn" id="saveBtn">💾 حفظ التعديلات</button>
  <div class="status-text" id="statusText"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// 🆕 التعامل مع زر "Back" (زر أندرويد النظامي أو سهم تلغرام): افتراضياً تلغرام
// بيسكر الـ Mini App كاملة عند أي ضغطة Back ما إلها معالج مسجَّل. المطلوب هون:
// لو كيبورد MathLive الرياضي ظاهر حالياً، الضغطة الأولى تسكره بس (نفس سلوك كيبورد
// الجوال العادي)، وبعدها إذا ضغط تاني (والكيبورد مقفول) فعلاً يسكر الصفحة. راجع
// mathlive.io/mathfield/guides/virtual-keyboard: الكيبورد singleton واحد مشترك
// لكل الحقول، متاح تلقائياً عالـ window بعد تحميل المكتبة (window.mathVirtualKeyboard).
if (tg.BackButton) {
  tg.BackButton.show();
  tg.BackButton.onClick(() => {
    const vk = window.mathVirtualKeyboard;
    if (vk && vk.visible) {
      vk.hide();
      // منع الحقل من إعادة فتح الكيبورد فوراً بسبب بقائه مركّزاً عليه (focus)
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    } else {
      tg.close();
    }
  });
}

const params = new URLSearchParams(window.location.search);
const quizId = params.get("quiz_id") || "";
const questionIndex = parseInt(params.get("question_index"), 10);

const loadingState = document.getElementById("loadingState");
const errorState = document.getElementById("errorState");
const formState = document.getElementById("formState");
const footerBar = document.getElementById("footerBar");
const statusText = document.getElementById("statusText");
const saveBtn = document.getElementById("saveBtn");

const segmentsContainer = document.getElementById("segmentsContainer");
const questionCounter = document.getElementById("questionCounter");
const addTextSegmentBtn = document.getElementById("addTextSegmentBtn");
const addMathSegmentBtn = document.getElementById("addMathSegmentBtn");
const optionsContainer = document.getElementById("optionsContainer");
const tableToggle = document.getElementById("tableToggle");
const tableEditor = document.getElementById("tableEditor");
const matricesContainer = document.getElementById("matricesContainer");
const addMatrixBtn = document.getElementById("addMatrixBtn");
const fullPreview = document.getElementById("fullPreview");

let LIMITS = {
  max_question_len: 2000, max_option_len: 500, max_cell_len: 60,
  max_table_rows: 12, max_table_cols: 8,
  max_matrices: 4, max_matrix_rows: 6, max_matrix_cols: 6,
};
let correctOptionId = null;

// ==================== أدوات مساعدة عامة ====================
function escapeHtml(str) {
  // لازم نغطي " كمان (مو بس &<>) لأن الناتج بينحقن جوا value="..." بعدة أماكن،
  // ورموز الرياضيات كتير بتحوي " (إنش) بشكل طبيعي.
  return String(str).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function waitForMathLive(timeoutMs) {
  if (window.__mathliveReady && customElements.get("math-field")) return Promise.resolve(true);
  return Promise.race([
    customElements.whenDefined("math-field").then(() => true),
    new Promise((resolve) => setTimeout(() => resolve(false), timeoutMs)),
  ]);
}

// كل الحقول (نص السؤال، الإجابات، خلايا الجدول/المصفوفات) بترسل حدث "input" نفسه
// بعد أي تغيير - هالدالة موصولة فيهم كلهم لتحديث المعاينة الحية بشكل موحّد.
let previewTimer = null;
function debouncedPreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 250);
}

// ==================== 🆕 أجزاء نص السؤال (نص عادي / معادلة) ====================
// بدل صندوق نص واحد فيه كود LaTeX مختلط بالعربي، نص السؤال هون عبارة عن قائمة
// "أجزاء" مرتبة: جزء نص عادي (input عادي) أو جزء معادلة (math-field بصري). المستخدم
// بيضيف جزء جزء بالترتيب اللي بدو ياه يقرأ فيه الجملة. عند الحفظ، منلزّق الأجزاء
// وراء بعض ومنحيط أجزاء المعادلات بعلامتي $...$ تلقائياً (نفس الصيغة اللي يفهمها
// محرك الرسم بالبوت) - المستخدم ما بيكتب ولا يشوف $ إطلاقاً.
let questionSegments = [];

function parseIntoSegments(text) {
  const segments = [];
  const re = /\$(.+?)\$/gs;
  let lastIndex = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > lastIndex) segments.push({ type: "text", value: text.slice(lastIndex, m.index) });
    segments.push({ type: "math", value: m[1] });
    lastIndex = re.lastIndex;
  }
  if (lastIndex < text.length) segments.push({ type: "text", value: text.slice(lastIndex) });
  if (segments.length === 0) segments.push({ type: "text", value: "" });
  return segments;
}

function createSegmentField(type, value) {
  const row = document.createElement("div");
  row.className = "segment-row";

  const tag = document.createElement("span");
  tag.className = "segment-tag";
  tag.textContent = type === "math" ? "∑" : "abc";
  row.appendChild(tag);

  let field;
  if (type === "math") {
    field = document.createElement("math-field");
    field.value = value;
    field.className = "mf-full";
  } else {
    field = document.createElement("input");
    field.type = "text";
    field.value = value;
    field.placeholder = "اكتب نص عادي هون...";
  }
  field.addEventListener("input", debouncedPreview);
  row.appendChild(field);

  const removeBtn = document.createElement("button");
  removeBtn.type = "button";
  removeBtn.className = "remove-x";
  removeBtn.textContent = "✕";
  row.appendChild(removeBtn);

  const seg = { type, field, row, getValue() { return field.value || ""; } };
  removeBtn.addEventListener("click", () => {
    if (questionSegments.length <= 1) return; // لازم يضل جزء واحد ع الأقل
    questionSegments = questionSegments.filter((s) => s !== seg);
    row.remove();
    updatePreview();
  });
  return seg;
}

function addSegment(type, value, focus) {
  const seg = createSegmentField(type, value);
  questionSegments.push(seg);
  segmentsContainer.appendChild(seg.row);
  if (focus) setTimeout(() => seg.field.focus(), 50);
  return seg;
}

function buildQuestionSegments(text) {
  segmentsContainer.innerHTML = "";
  questionSegments = [];
  parseIntoSegments(text).forEach((s) => addSegment(s.type, s.value, false));
}

function getQuestionRawText() {
  return questionSegments.map((s) => (s.type === "math" ? "$" + s.getValue() + "$" : s.getValue())).join("");
}

addTextSegmentBtn.addEventListener("click", () => { addSegment("text", "", true); updatePreview(); });
addMathSegmentBtn.addEventListener("click", () => { addSegment("math", "", true); updatePreview(); });

// ==================== 🆕 حقل قابل للتبديل: نص عادي ⟷ معادلة بصرية ====================
// يُستخدم للإجابات وخلايا الجدول/المصفوفات - غالباً تعبير رياضي بحت (زي "$x=6$")
// لكن أحياناً نص عادي بحت (زي عنوان عمود "الفئة") فمنسيب زر تبديل صغير بدل ما
// نفرض معادلة دايماً. نفس مبدأ الأجزاء أعلاه: ما في $ ولا LaTeX ظاهر للمستخدم أبداً.
function parseWholeMathToggle(raw) {
  const trimmed = (raw || "").trim();
  const m = trimmed.match(/^\$(.+)\$$/s);
  if (m) return { isMath: true, value: m[1] };
  return { isMath: false, value: raw || "" };
}

function createMathToggleField(rawValue, opts) {
  opts = opts || {};
  const compact = !!opts.compact;
  const maxLen = opts.maxLen;

  const wrap = document.createElement("div");
  wrap.className = "mtf-wrap" + (compact ? " compact" : "");
  const row = document.createElement("div");
  row.className = "mtf-row";
  const toggleBtn = document.createElement("button");
  toggleBtn.type = "button";
  toggleBtn.title = "بدّل بين نص عادي ومعادلة";
  toggleBtn.className = "mtf-toggle";
  const slot = document.createElement("div");
  slot.className = "mtf-slot";
  row.appendChild(toggleBtn);
  row.appendChild(slot);
  wrap.appendChild(row);

  const parsed = parseWholeMathToggle(rawValue);
  const state = { isMath: parsed.isMath, value: parsed.value };

  function renderField() {
    slot.innerHTML = "";
    let field;
    if (state.isMath) {
      field = document.createElement("math-field");
      field.value = state.value;
      field.className = compact ? "mf-compact" : "mf-full";
      field.addEventListener("input", () => { state.value = field.value; debouncedPreview(); });
      toggleBtn.textContent = "∑";
    } else {
      field = document.createElement(compact ? "input" : "textarea");
      if (compact) { field.type = "text"; } else { field.rows = 2; }
      field.value = state.value;
      if (maxLen) field.maxLength = maxLen;
      field.addEventListener("input", () => { state.value = field.value; debouncedPreview(); });
      toggleBtn.textContent = "abc";
    }
    slot.appendChild(field);
  }
  toggleBtn.addEventListener("click", () => {
    state.isMath = !state.isMath;
    renderField();
    debouncedPreview();
  });
  renderField();

  return {
    el: wrap,
    getRaw() { return state.isMath ? ("$" + state.value + "$") : state.value; },
    isEmpty() { return !state.value || !String(state.value).trim(); },
  };
}

// ==================== تحميل بيانات السؤال ====================
if (!quizId || Number.isNaN(questionIndex)) {
  showError("رابط غير صالح - ارجع للمحادثة وأعد فتح المحرر من جديد.");
} else {
  loadQuestion();
}

async function loadQuestion() {
  try {
    const mathliveOk = await waitForMathLive(4000);
    if (!mathliveOk) {
      showError("تعذر تحميل محرر الرياضيات (مشكلة اتصال بالإنترنت) - أعد تحميل الصفحة وحاول من جديد.");
      return;
    }

    const res = await fetch("/api/question-edit/fetch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ init_data: tg.initData, quiz_id: quizId, question_index: questionIndex }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showError(err.detail || "تعذر تحميل السؤال.");
      return;
    }
    const data = await res.json();
    LIMITS = data.limits || LIMITS;
    correctOptionId = data.correct_option_id;

    buildQuestionSegments(data.question || "");
    buildOptions(data.options || []);
    buildTableEditor(data.table);
    buildMatrices(data.matrices || []);
    updatePreview();

    loadingState.style.display = "none";
    formState.style.display = "block";
    footerBar.style.display = "block";
  } catch (e) {
    showError("تعذر الاتصال بالخادم، تحقق من الإنترنت وحاول من جديد.");
  }
}

function showError(msg) {
  loadingState.style.display = "none";
  errorState.style.display = "block";
  errorState.textContent = "⚠️ " + msg;
}

// ==================== الإجابات ====================
let optionFields = [];
function buildOptions(options) {
  optionsContainer.innerHTML = "";
  optionFields = [];
  options.forEach((opt, idx) => {
    const block = document.createElement("div");
    block.className = "option-block";
    const isCorrect = correctOptionId === idx;
    const header = document.createElement("div");
    header.className = "option-header";
    header.innerHTML = `<label class="field-label" style="margin:0;">الإجابة ${idx + 1}</label>${isCorrect ? '<span class="correct-badge">✅ الإجابة الصحيحة</span>' : ""}`;
    block.appendChild(header);
    const field = createMathToggleField(opt, { maxLen: LIMITS.max_option_len, compact: false });
    block.appendChild(field.el);
    optionsContainer.appendChild(block);
    optionFields.push(field);
  });
}
function getOptionValues() { return optionFields.map((f) => f.getRaw()); }

// ==================== محرر الجدول ====================
let tableFields = { headers: [], rows: [] };

function buildTableEditor(table) {
  const hasTable = !!(table && ((table.headers && table.headers.length) || (table.rows && table.rows.length)));
  tableToggle.checked = hasTable;
  const src = hasTable ? table : { headers: ["", ""], rows: [["", ""]] };
  tableFields = {
    headers: src.headers.map((h) => createMathToggleField(h, { compact: true, maxLen: LIMITS.max_cell_len })),
    rows: src.rows.map((row) => row.map((c) => createMathToggleField(c, { compact: true, maxLen: LIMITS.max_cell_len }))),
  };
  tableEditor.style.display = hasTable ? "block" : "none";
  renderTableGrid();
}

tableToggle.addEventListener("change", () => {
  tableEditor.style.display = tableToggle.checked ? "block" : "none";
  updatePreview();
});

function newCellField() { return createMathToggleField("", { compact: true, maxLen: LIMITS.max_cell_len }); }

function renderTableGrid() {
  tableEditor.innerHTML = "";
  const cols = tableFields.headers.length;

  const table = document.createElement("table");
  table.className = "grid-table";
  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  for (let c = 0; c < cols; c++) {
    const th = document.createElement("th");
    th.appendChild(tableFields.headers[c].el);
    headRow.appendChild(th);
  }
  headRow.appendChild(document.createElement("th"));
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  tableFields.rows.forEach((rowFields, r) => {
    const tr = document.createElement("tr");
    rowFields.forEach((f) => {
      const td = document.createElement("td");
      td.appendChild(f.el);
      tr.appendChild(td);
    });
    const tdBtn = document.createElement("td");
    const rmBtn = document.createElement("button");
    rmBtn.type = "button"; rmBtn.className = "remove-x"; rmBtn.textContent = "✕";
    rmBtn.addEventListener("click", () => {
      tableFields.rows.splice(r, 1);
      renderTableGrid();
      updatePreview();
    });
    tdBtn.appendChild(rmBtn);
    tr.appendChild(tdBtn);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableEditor.appendChild(table);

  const btnRow = document.createElement("div");
  btnRow.className = "grid-btns";
  const addRowBtn = document.createElement("button");
  addRowBtn.type = "button"; addRowBtn.className = "small-btn"; addRowBtn.textContent = "➕ صف";
  addRowBtn.disabled = tableFields.rows.length >= LIMITS.max_table_rows;
  addRowBtn.addEventListener("click", () => {
    if (tableFields.rows.length >= LIMITS.max_table_rows) return;
    tableFields.rows.push(tableFields.headers.map(() => newCellField()));
    renderTableGrid();
  });
  const addColBtn = document.createElement("button");
  addColBtn.type = "button"; addColBtn.className = "small-btn"; addColBtn.textContent = "➕ عمود";
  addColBtn.disabled = tableFields.headers.length >= LIMITS.max_table_cols;
  addColBtn.addEventListener("click", () => {
    if (tableFields.headers.length >= LIMITS.max_table_cols) return;
    tableFields.headers.push(newCellField());
    tableFields.rows.forEach((row) => row.push(newCellField()));
    renderTableGrid();
  });
  btnRow.appendChild(addRowBtn);
  btnRow.appendChild(addColBtn);
  tableEditor.appendChild(btnRow);
}

function getTablePayload() {
  if (!tableToggle.checked || !tableFields.headers.length) return null;
  return {
    headers: tableFields.headers.map((f) => f.getRaw()),
    rows: tableFields.rows.map((row) => row.map((f) => f.getRaw())),
  };
}

// ==================== محرر المصفوفات ====================
let matrixCards = [];

function buildMatrices(matricesData) {
  matricesContainer.innerHTML = "";
  matrixCards = [];
  (matricesData || []).forEach((m) => addMatrixCard(m));
  addMatrixBtn.disabled = matrixCards.length >= LIMITS.max_matrices;
}

addMatrixBtn.addEventListener("click", () => {
  if (matrixCards.length >= LIMITS.max_matrices) return;
  addMatrixCard({ label: "", bracket: "square", rows: [["", ""], ["", ""]] });
  addMatrixBtn.disabled = matrixCards.length >= LIMITS.max_matrices;
  updatePreview();
});

function addMatrixCard(m) {
  const card = document.createElement("div");
  card.className = "matrix-card";

  const topRow = document.createElement("div");
  topRow.className = "matrix-top-row";

  // 🆕 التسمية (مثل "A =") نص عادي دايماً - مش تعبير رياضي بذاته، فما بتحتاج تبديل.
  const labelInput = document.createElement("input");
  labelInput.type = "text";
  labelInput.value = m.label || "";
  labelInput.placeholder = "تسمية اختيارية مثل A =";
  labelInput.maxLength = LIMITS.max_cell_len;
  labelInput.addEventListener("input", debouncedPreview);

  const bracketSelect = document.createElement("select");
  bracketSelect.innerHTML = `
    <option value="square">قوس مربع [ ]</option>
    <option value="round">قوس دائري ( )</option>
    <option value="bar">محدّد | |</option>
  `;
  bracketSelect.value = m.bracket || "square";
  bracketSelect.addEventListener("change", debouncedPreview);

  const removeCardBtn = document.createElement("button");
  removeCardBtn.type = "button"; removeCardBtn.className = "remove-x"; removeCardBtn.textContent = "✕";

  topRow.appendChild(labelInput);
  topRow.appendChild(bracketSelect);
  topRow.appendChild(removeCardBtn);
  card.appendChild(topRow);

  const gridWrap = document.createElement("div");
  card.appendChild(gridWrap);

  const cardObj = {
    labelInput,
    bracketSelect,
    rows: (m.rows && m.rows.length ? m.rows : [["", ""], ["", ""]]).map((row) =>
      row.map((c) => createMathToggleField(c, { compact: true, maxLen: LIMITS.max_cell_len }))
    ),
  };

  function renderGrid() {
    gridWrap.innerHTML = "";
    const table = document.createElement("table");
    table.className = "grid-table";
    const tbody = document.createElement("tbody");
    cardObj.rows.forEach((rowFields, r) => {
      const tr = document.createElement("tr");
      rowFields.forEach((f) => {
        const td = document.createElement("td");
        td.appendChild(f.el);
        tr.appendChild(td);
      });
      const tdBtn = document.createElement("td");
      const rmBtn = document.createElement("button");
      rmBtn.type = "button"; rmBtn.className = "remove-x"; rmBtn.textContent = "✕";
      rmBtn.addEventListener("click", () => {
        if (cardObj.rows.length <= 1) return;
        cardObj.rows.splice(r, 1);
        renderGrid();
        updatePreview();
      });
      tdBtn.appendChild(rmBtn);
      tr.appendChild(tdBtn);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    gridWrap.appendChild(table);

    const btnRow = document.createElement("div");
    btnRow.className = "grid-btns";
    const addRowBtn = document.createElement("button");
    addRowBtn.type = "button"; addRowBtn.className = "small-btn"; addRowBtn.textContent = "➕ صف";
    addRowBtn.disabled = cardObj.rows.length >= LIMITS.max_matrix_rows;
    addRowBtn.addEventListener("click", () => {
      if (cardObj.rows.length >= LIMITS.max_matrix_rows) return;
      const cols = cardObj.rows[0] ? cardObj.rows[0].length : 2;
      const newRow = [];
      for (let c = 0; c < cols; c++) newRow.push(newCellField());
      cardObj.rows.push(newRow);
      renderGrid();
    });
    const addColBtn = document.createElement("button");
    addColBtn.type = "button"; addColBtn.className = "small-btn"; addColBtn.textContent = "➕ عمود";
    addColBtn.disabled = !!(cardObj.rows[0] && cardObj.rows[0].length >= LIMITS.max_matrix_cols);
    addColBtn.addEventListener("click", () => {
      if (cardObj.rows[0] && cardObj.rows[0].length >= LIMITS.max_matrix_cols) return;
      cardObj.rows.forEach((row) => row.push(newCellField()));
      renderGrid();
    });
    btnRow.appendChild(addRowBtn);
    btnRow.appendChild(addColBtn);
    gridWrap.appendChild(btnRow);
  }
  renderGrid();

  removeCardBtn.addEventListener("click", () => {
    matrixCards = matrixCards.filter((c) => c !== cardObj);
    card.remove();
    addMatrixBtn.disabled = matrixCards.length >= LIMITS.max_matrices;
    updatePreview();
  });

  matricesContainer.appendChild(card);
  matrixCards.push(cardObj);
}

function getMatricesPayload() {
  return matrixCards.map((c) => ({
    label: c.labelInput.value,
    bracket: c.bracketSelect.value,
    rows: c.rows.map((row) => row.map((f) => f.getRaw())),
  }));
}

// ==================== المعاينة الحية (KaTeX - للقراءة فقط) ====================
function stripMathWrap(raw) {
  const m = (raw || "").trim().match(/^\$(.+)\$$/s);
  return m ? m[1] : (raw || "");
}

const BRACKET_ENV = { square: "bmatrix", round: "pmatrix", bar: "vmatrix" };
function matrixToLatex(m) {
  // نطرح أي $..$ محيطة بكل خلية (لو المستخدم فعّل وضع معادلة لها) قبل تجميعها جوا
  // بيئة المصفوفة الواحدة - هي أصلاً بمنطقة رياضيات هون، فما بنحتاج نلفها بـ $ تانية.
  const body = m.rows.map((row) => row.map((cell) => escapeHtml(stripMathWrap(cell))).join(" & ")).join(" \\\\ ");
  const env = BRACKET_ENV[m.bracket] || "bmatrix";
  const label = m.label ? escapeHtml(m.label) + " " : "";
  return `${label}$\\begin{${env}}${body}\\end{${env}}$`;
}

function updatePreview() {
  const qText = getQuestionRawText();
  const options = getOptionValues();
  let html = `<div style="margin-bottom:8px;"><b>س:</b> ${escapeHtml(qText)}</div>`;
  options.forEach((opt, idx) => {
    html += `<div>${idx + 1}. ${escapeHtml(opt)}</div>`;
  });

  const tablePayload = getTablePayload();
  if (tablePayload) {
    html += '<table style="margin-top:10px;border-collapse:collapse;width:100%;">';
    html += "<tr>" + tablePayload.headers.map((h) => `<th style="border:1px solid #ccc;padding:4px;font-size:12px;">${escapeHtml(h)}</th>`).join("") + "</tr>";
    tablePayload.rows.forEach((row) => {
      html += "<tr>" + row.map((c) => `<td style="border:1px solid #ccc;padding:4px;font-size:12px;text-align:center;">${escapeHtml(c)}</td>`).join("") + "</tr>";
    });
    html += "</table>";
  }

  getMatricesPayload().forEach((m) => {
    if (m.rows.some((row) => row.length)) html += `<div style="margin-top:10px;">${matrixToLatex(m)}</div>`;
  });

  fullPreview.innerHTML = html;
  questionCounter.textContent = `${qText.length} / ${LIMITS.max_question_len}`;
  try {
    renderMathInElement(fullPreview, {
      delimiters: [{ left: "$", right: "$", display: false }],
      throwOnError: false,
    });
  } catch (e) { /* أي خطأ صياغة لا يجب أن يكسر الصفحة - نتجاهله بصمت هون فقط للمعاينة */ }
}

// ==================== الحفظ ====================
saveBtn.addEventListener("click", async () => {
  statusText.className = "status-text";
  statusText.textContent = "";

  const questionRaw = getQuestionRawText();
  const questionHasContent = questionSegments.some((s) => s.getValue() && s.getValue().trim());
  if (!questionHasContent) {
    statusText.className = "status-text error";
    statusText.textContent = "⚠️ نص السؤال لا يمكن أن يكون فارغاً.";
    return;
  }
  if (questionRaw.length > LIMITS.max_question_len) {
    statusText.className = "status-text error";
    statusText.textContent = `⚠️ نص السؤال طويل جداً (الحد ${LIMITS.max_question_len} حرف).`;
    return;
  }
  if (optionFields.some((f) => f.isEmpty())) {
    statusText.className = "status-text error";
    statusText.textContent = "⚠️ لا يمكن ترك أي إجابة فارغة.";
    return;
  }

  const payload = {
    init_data: tg.initData,
    quiz_id: quizId,
    question_index: questionIndex,
    question: questionRaw,
    options: getOptionValues(),
    table: getTablePayload(),
    matrices: getMatricesPayload(),
  };

  saveBtn.disabled = true;
  statusText.textContent = "⏳ جارٍ الحفظ...";
  try {
    const res = await fetch("/api/question-edit/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      statusText.className = "status-text error";
      statusText.textContent = "⚠️ " + (err.detail || "تعذر حفظ التعديل.");
      saveBtn.disabled = false;
      return;
    }
    statusText.className = "status-text ok";
    statusText.textContent = "✅ تم الحفظ! رجّعك عالمحادثة...";
    setTimeout(() => tg.close(), 800);
  } catch (e) {
    statusText.className = "status-text error";
    statusText.textContent = "⚠️ تعذر الاتصال بالخادم، حاول من جديد.";
    saveBtn.disabled = false;
  }
});
</script>
