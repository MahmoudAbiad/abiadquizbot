name: Deterministic reliability tests
on:
  push:
    branches: [master, test]
  pull_request:
    branches: [master, test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies only
        run: python -m pip install pymupdf pillow python-docx python-pptx redis aiogram==3.29.1 httpx==0.28.1 google-genai==2.10.0 matplotlib==3.9.2 'reportlab>=4.0.0' arabic-reshaper python-bidi
      - name: Compile repository
        run: python -m compileall -q .
      - name: Run regression tests against local Redis
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify provider SQL in isolated PostgreSQL
        run: |
          npm ci --prefix tests/sql --ignore-scripts
          node tests/sql/ai_providers_test.mjs
